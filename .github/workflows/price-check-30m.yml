# Vercel Hobby: one built-in cron/day. This workflow triggers production every 30 minutes.
# Repo secret CRON_SECRET must match Vercel env CRON_SECRET.

name: Price check (30m)

on:
  schedule:
    # UTC :08 and :38 (→ :11 and :41 Europe/Istanbul). Change these lines if schedule runs stay at zero (re-activates actor).
    # Schedule runs use the GitHub user who last *pushed* an edit to this cron block (not the git author).
    # If only a bot edited this file, cron may never fire until a human with write access merges a cron change.
    # If Actions shows "This scheduled workflow is disabled", open the workflow and click Enable workflow (cloud tokens cannot).
    - cron: "8 * * * *"
    - cron: "38 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [price-check-30m]

permissions:
  contents: read

concurrency:
  group: price-check-30m
  cancel-in-progress: false

jobs:
  call-prod-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger /api/cron/check-prices
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_URL: https://indirim-takip-two.vercel.app/api/cron/check-prices
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::GitHub secret CRON_SECRET is not set. See docs/EXTERNAL_CRON.md"
            exit 1
          fi
          echo "Calling ${CRON_URL}"
          curl -fsS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${CRON_URL}"
          echo ""
